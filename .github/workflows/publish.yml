# Publish a release to TestPyPI, then (after manual approval) to PyPI, by Trusted Publishing.
# Runs only when a GitHub release is published. It runs no tests and stores no credentials.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse anything but a v* tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v*) echo "Building tag $TAG" ;;
            *) echo "Refusing to build '$TAG': not a v* tag" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Show interpreter and zlib
        run: python -c "import sys, zlib; print(sys.version); print('zlib.ZLIB_RUNTIME_VERSION', zlib.ZLIB_RUNTIME_VERSION)"
      - name: Set SOURCE_DATE_EPOCH to the tag commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build and check
        run: |
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build
          twine check --strict dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
